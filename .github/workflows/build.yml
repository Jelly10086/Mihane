name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current version to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.build-inputs.outputs.version }}
      version_code: ${{ steps.build-inputs.outputs.version_code }}
    env:
      GOMAXPROCS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            app/src/main/native/mishka_core/go.sum
            mihomo/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set CI build inputs
        id: build-inputs
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*const val VERSION_NAME = "\([^"]*\)".*/\1/p' build-logic/src/main/kotlin/ProjectConfig.kt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag does not match VERSION_NAME" >&2; exit 1; }
          elif [[ "$PUBLISH_RELEASE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Manual releases must use main or a matching version tag" >&2
            exit 1
          fi
          version_code=$((1000000 + GITHUB_RUN_NUMBER))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "CI_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "MISANS_ARCHIVE=$RUNNER_TEMP/mihane-fonts/MiSans.zip" >> "$GITHUB_ENV"

      - name: Download and verify MiSans
        run: bash .github/scripts/prepare-misans.sh

      - name: Prepare fixed signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY:?Missing SIGNING_KEY}"
          : "${KEY_STORE_PASSWORD:?Missing KEY_STORE_PASSWORD}"
          : "${ALIAS:?Missing ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          keystore="$RUNNER_TEMP/mihane-signing.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -exportcert -keystore "$keystore" -alias "$ALIAS" \
            -storepass:env KEY_STORE_PASSWORD -file "$RUNNER_TEMP/mihane-signing.der"
          printf '%s  %s\n' "$(< .github/ci/signing-certificate.sha256)" \
            "$RUNNER_TEMP/mihane-signing.der" | sha256sum --check --strict
          {
            echo "KEYSTORE_PATH=$keystore"
            echo "KEYSTORE_PASS=$KEY_STORE_PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Download GeoIP files
        run: ./gradlew --no-daemon :app:downloadGeoFiles

      - name: Build and lint all APKs
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -I .github/ci/android.init.gradle
          :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Verify all ABI artifacts
        shell: bash
        env:
          PUBLISH_APKS: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_APKS" == true ]]; then
            python3 .github/scripts/verify-apks.py --signed
          else
            python3 .github/scripts/verify-apks.py
          fi

      - name: Upload Debug APK (arm64-v8a)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-arm64-v8a-debug.apk
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Debug APK (armeabi-v7a)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-armeabi-v7a-debug.apk
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Debug APK (x86_64)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-x86_64-debug.apk
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Debug APK (x86)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-x86-debug.apk
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release APK (arm64-v8a)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-arm64-v8a-release.apk
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release APK (armeabi-v7a)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-armeabi-v7a-release.apk
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release APK (x86_64)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-x86_64-release.apk
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          archive: false
          if-no-files-found: error

      - name: Upload Release APK (x86)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mihane-v${{ steps.build-inputs.outputs.version }}(${{ steps.build-inputs.outputs.version_code }})-x86-release.apk
          path: app/build/outputs/apk/release/*-x86-*.apk
          archive: false
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/mihane-signing.jks" "$RUNNER_TEMP/mihane-signing.der"

  publish-release:
    name: Publish Release
    needs: build-apk
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified Release APKs
        uses: actions/download-artifact@v8
        with:
          pattern: mihane-*-release.apk
          merge-multiple: true
          path: release-apks

      - name: Publish signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-apk.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.build-apk.outputs.version_code }}
        run: bash .github/scripts/publish-release.sh release-apks
